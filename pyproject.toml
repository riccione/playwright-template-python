[project]
name = "playwright-template-python"
version = "0.1.0"
description = "End-to-end testing framework with Playwright, pytest, Page Object Model, and dual reporting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "allure-pytest>=2.16.0",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.8.0",
    "pytest-rerunfailures>=16.3",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
]

# =============================================================================
# Ruff Configuration (equivalent to eslint + prettier in TypeScript template)
# =============================================================================
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
]
ignore = [
    "T201",  # allow print() in tests for debugging
    "S101",  # allow assert in tests
    "PT003", # allow explicit scope='function' in fixtures
    "S110",  # allow try-except-pass in teardown
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
